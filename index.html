<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PSD_eNGINNo 3D-iFM Summer LaSalle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: fixed left nav (Hard / Soft / Management) + sticky topbar + scrolling work area. Dark-first, same token set as iMATOMs modules. */
:root{
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#21262D;
  --border:#30363D;--border2:#3D444D;
  --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;--grid:rgba(255,255,255,.05);
  --topbar:rgba(13,17,23,.92);--overlay:rgba(0,0,0,.72);--side:#161B22;
  --orange:#F97316;--green:#22C55E;--yellow:#EAB308;--red:#EF4444;--blue:#3B82F6;--purple:#A855F7;--teal:#14B8A6;--pink:#EC4899;--lime:#84CC16;
  --accent:#F97316;--hard:#F97316;--soft:#14B8A6;
  --font:'Sarabun',system-ui,sans-serif;--font-display:'Rajdhani','Sarabun',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:8px;--radius-lg:12px;--sidebar-w:258px;--header-h:58px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#E9ECF0;--bg2:#FFFFFF;--bg3:#F1F3F6;--bg4:#E1E5EB;--border:#D3D9E1;--border2:#BCC5D1;--side:#F3F4F7;
  --text:#0F172A;--text2:#475569;--text3:#64748B;--grid:rgba(15,23,42,.07);--topbar:rgba(233,236,240,.94);--overlay:rgba(15,23,42,.45);
  --accent:#EA580C;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#E9ECF0;--bg2:#FFFFFF;--bg3:#F1F3F6;--bg4:#E1E5EB;--border:#D3D9E1;--border2:#BCC5D1;--side:#F3F4F7;
  --text:#0F172A;--text2:#475569;--text3:#64748B;--grid:rgba(15,23,42,.07);--topbar:rgba(233,236,240,.94);--overlay:rgba(15,23,42,.45);
  --accent:#EA580C;color-scheme:light}
/* ตามระบบ (system) on a light OS → dark-grey "dim" palette, so it is clearly different from Light */
@media (prefers-color-scheme: light){:root[data-theme="system"]{
  --bg:#2D333B;--bg2:#373E47;--bg3:#424A54;--bg4:#4B5460;--border:#545D68;--border2:#636E7B;
  --text:#E3E9EF;--text2:#B4BFCB;--text3:#94A1AF;--grid:rgba(255,255,255,.07);--topbar:rgba(45,51,59,.94);--overlay:rgba(0,0,0,.6);--side:#24292F;
  --accent:#F97316;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#21262D;--border:#30363D;--border2:#3D444D;
  --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;--grid:rgba(255,255,255,.05);--topbar:rgba(13,17,23,.92);--overlay:rgba(0,0,0,.72);--side:#161B22;
  --accent:#F97316;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow:hidden;padding-left:env(safe-area-inset-left,0px);transition:transform .2s}
.sb-hd{padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.sb-brand{display:flex;gap:10px;align-items:center}
.sb-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.5px;flex-shrink:0}
.sb-logo{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.sb-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.1}
.sb-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sb-biz{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;cursor:pointer}
.sb-biz:hover{border-color:var(--accent)}
.sb-biz .bi{font-size:18px}
.sb-biz .bn{font-size:12px;font-weight:600;line-height:1.2}
.sb-biz .bs{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sb-sec{padding:14px 18px 5px;font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sb-sec .dot{width:7px;height:7px;border-radius:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);margin:1px 8px;cursor:pointer;font-size:13px;color:var(--text2);border:1px solid transparent;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--nc,var(--accent)) 13%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--nc,var(--accent)) 35%,transparent)}
.nav-item .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--nc,var(--accent)) 14%,transparent);flex-shrink:0}
.nav-item .th{font-size:10px;color:var(--text3);display:block;line-height:1.1}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.sb-ft{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
#nav{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.sb-hd,.sb-user,.sb-ft{flex-shrink:0}
.sb-ft .sb-more{display:none}
.sb-user{padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sb-user .u{display:flex;align-items:center;gap:10px}
.sb-user .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex-shrink:0}
.sb-user .n{font-size:13px;font-weight:700;line-height:1.2;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .r{font-size:11px;color:var(--text3)}
.sb-user .btn{width:100%;justify-content:center}
#login{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#login[hidden]{display:none}
.lg-card{width:420px;max-width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.35)}
.lg-hero{background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff;text-align:center;padding:26px 16px 20px}
.lg-hero .k{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;color:#e69a3c}
.lg-hero .t{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:2px}
.lg-hero .t span{color:#e6672f}
.lg-hero .s{font-size:11px;letter-spacing:.12em;color:#4fd17a;margin-top:4px}
.lg-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px}
.lg-card{width:460px}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg3);border-radius:10px;padding:4px}
.lg-tabs button{border:0;background:transparent;color:var(--text2);font:inherit;font-weight:600;padding:8px;border-radius:7px;cursor:pointer}
.lg-tabs button.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.lg-form{display:flex;flex-direction:column;gap:10px}
.lg-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lg-pw{position:relative}.lg-pw .fc{padding-right:40px}.lg-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:16px;color:var(--text3)}
.lg-msg{background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:8px;padding:8px 12px;font-size:13px}
.lg-ok{background:color-mix(in srgb,var(--green) 12%,transparent);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);color:var(--green);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.lg-srv{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px}
.lg-srvbox{display:flex;flex-direction:column;gap:8px;background:var(--bg3);border-radius:10px;padding:10px}
.lg-hint{font-size:12px;color:var(--text3);text-align:center;line-height:1.6}.lg-hint code{font-family:var(--font-mono);color:var(--accent);background:var(--bg3);padding:1px 5px;border-radius:4px}
.sb-user .u{cursor:pointer}
.lg-link{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 0;align-self:flex-end}.lg-link:hover{text-decoration:underline}

#sb-overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:90}

/* MAIN */
#main{margin-left:var(--sidebar-w);min-height:100vh}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);min-height:var(--header-h);background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px 20px;gap:12px;z-index:50;flex-wrap:wrap}
#hamb{display:none}
.tb-title{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.1}
.tb-bc{font-size:11px;color:var(--text3)}
.tb-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#clock{font-family:var(--font-mono);font-size:12px;color:var(--text3)}
#content{padding:22px max(20px,env(safe-area-inset-right,0px)) 40px 20px}

/* PRIMITIVES */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;min-width:0}
.card-t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-t small{font-family:var(--font);font-weight:400;font-size:11px;color:var(--text3)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent))}
.kpi-l{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.kpi-v{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;color:var(--kc,var(--text));font-variant-numeric:tabular-nums}
.kpi-v small{font-size:14px;margin-left:2px}
.kpi-s{font-size:11px;color:var(--text3);margin-top:5px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart-wrap{position:relative;height:250px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-title{font-family:var(--font-display);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;text-wrap:balance}
.sec-sub{font-size:12px;color:var(--text3);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:5px;text-transform:uppercase}
.pill-hard{background:color-mix(in srgb,var(--hard) 15%,transparent);color:var(--hard)}
.pill-soft{background:color-mix(in srgb,var(--soft) 15%,transparent);color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}.btn-danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.btn-ok{background:transparent;border-color:var(--green);color:var(--green)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-ic{padding:4px 7px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--bc) 14%,transparent);color:var(--bc)}
.b-green{--bc:var(--green)}.b-yellow{--bc:var(--yellow)}.b-red{--bc:var(--red)}.b-blue{--bc:var(--blue)}.b-orange{--bc:var(--orange)}.b-gray{--bc:var(--text2)}.b-teal{--bc:var(--teal)}.b-purple{--bc:var(--purple)}
.svc-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:color-mix(in srgb,var(--sc) 13%,transparent);color:var(--sc);white-space:nowrap}
.tag{display:inline-block;background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;font-family:var(--font-mono);color:var(--text2);white-space:nowrap}
.alert{padding:10px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;border:1px solid;background:color-mix(in srgb,var(--ac) 10%,transparent);border-color:color-mix(in srgb,var(--ac) 30%,transparent);color:var(--text)}
.alert b{color:var(--ac)}
.a-info{--ac:var(--blue)}.a-warn{--ac:var(--yellow)}.a-danger{--ac:var(--red)}.a-ok{--ac:var(--green)}
.metric-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:3px}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text2);font-weight:600;border:none;background:none;white-space:nowrap}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* TABLE */
.tbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.search:focus,.fc:focus{border-color:var(--accent)}
.count{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:9px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3);color:var(--text)}
td.strong{color:var(--text);font-weight:600}
td.desc{max-width:280px;min-width:160px}
td.act{white-space:nowrap;text-align:right}
td.empty{text-align:center;padding:28px;color:var(--text3)}
.num{text-align:right}

/* FORM / MODAL */
.fc{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 11px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
select.fc option{background:var(--bg3);color:var(--text)}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
.fl .req{color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.modal-ov{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:700px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-t{font-family:var(--font-display);font-size:19px;font-weight:700}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.ferr{color:var(--red);font-size:12px;margin-right:auto}

/* DASHBOARD */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero-main{display:flex;gap:18px;align-items:center}
.hero-ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--bzc) 16%,transparent);border:1px solid color-mix(in srgb,var(--bzc) 40%,transparent);flex-shrink:0}
.hero-k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:700}
.hero-n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;text-wrap:balance}
.hero-s{font-size:12px;color:var(--text3);margin-top:4px}
.idx{display:flex;align-items:center;gap:18px}
.idx-v{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.idx-split{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.svc-grid{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1500px){.svc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--sc)}
.svc-card:hover{border-color:var(--sc)}
.svc-top{display:flex;justify-content:space-between;align-items:center}
.svc-ic{font-size:20px}
.svc-n{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.1}
.svc-th{font-size:11px;color:var(--text3)}
.svc-score{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.svc-meta{font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.alert-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius);background:var(--bg3);cursor:pointer;border-left:3px solid var(--ac)}
.al:hover{background:var(--bg4)}
.al .m{font-size:12.5px;color:var(--text);line-height:1.35}
.al .s{font-size:11px;color:var(--text3)}

// ---------- KPI calculations ----------
function slaOf(t){const S=SLA[t.priority]||SLA.P3,f=S.f*6e4,st=new Date(t.date).getTime();
  if(t.completedAt){return{s:(new Date(t.completedAt).getTime()-st)<=f?'met':'breach'}}
  if(t.status==='On Hold')return{s:'hold'};
  const left=st+f-Date.now();return left<0?{s:'breach',open:1}:{s:'open',left:left/6e4}}
function slaPct(svc){let m=0,b=0;D.tickets.forEach(t=>{if(svc?t.service!==svc:!svcOn(t.service))return;const s=slaOf(t).s;if(s==='met')m++;else if(s==='breach')b++});return m+b?Math.round(m/(m+b)*100):100}
function pmPct(svc){const t=D.pm.filter(p=>p.service===svc&&p.dueDate<=todayS);return t.length?Math.round(t.filter(p=>p.status==='Done').length/t.length*100):100}
function compRows(svc){return D.compliance.filter(x=>!svc||x.service===svc).map(SCH.compliance.derive)}
function compPct(svc){const c=compRows(svc);return c.length?Math.round(c.filter(x=>x.status!=='Overdue').length/c.length*100):100}
function uptime(){const a=D.assets;return a.length?Math.round(a.filter(x=>x.status==='Running'||x.status==='Standby').length/a.length*100):100}
function defClose(){const d=D.defects;return d.length?Math.round(d.filter(x=>x.status==='Closed').length/d.length*100):100}
function hkScore(days=30){const s=D.hkInsp.filter(x=>x.date>=addD(todayS,-days));return s.length?avg(s.map(x=>x.score)):0}
function hkDone(){const t=D.hkTasks;return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function patrolPct(post){const p=D.patrols.filter(x=>x.date>=addD(todayS,-7)&&(!post||x.post===post));const pl=sum(p,x=>x.planned);return pl?Math.round(sum(p,x=>x.scanned)/pl*100):100}
function incClose(){const s=D.secInc;return s.length?Math.round(s.filter(x=>x.status==='Closed').length/s.length*100):100}
function pestPct(){const s=D.pestSt;return s.length?Math.round(s.filter(x=>x.activity==='None'||x.activity==='Low').length/s.length*100):100}
function gdnPct(){const z=D.gdnZones;return z.length?Math.round(sum(z,x=>x.health==='Good'?1:x.health==='Fair'?.6:0)/z.length*100):100}
function gdnOnTime(){const t=D.gdnTasks.filter(x=>x.status!=='Scheduled');return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function linPct(){return D.linenItems.length?avg(D.linenItems.map(x=>SCH.linenItems.derive(x)._avail)):100}
function linLoss(){const par=sum(D.linenItems,x=>x.par);return par?Math.round(sum(D.linenItems,x=>(+x.reject||0)+(+x.lost||0))/par*1000)/10:0}
const SCORE={
  eng:()=>avg([slaPct('eng'),pmPct('eng'),uptime(),compPct('eng')]),
  fac:()=>avg([slaPct('fac'),pmPct('fac'),compPct('fac'),defClose()]),
  hk:()=>avg([slaPct('hk'),hkScore(),hkDone()]),
  sec:()=>avg([slaPct('sec'),patrolPct(),incClose()]),
  pest:()=>avg([slaPct('pest'),pestPct()]),
  gdn:()=>avg([slaPct('gdn'),gdnPct(),gdnOnTime()]),
  lin:()=>avg([slaPct('lin'),linPct()]),
};
function KPIS(){const T=P().target;return[
  ['eng','SLA งานแจ้งซ่อม',()=>slaPct('eng'),T.sla,'%',0,'sla'],['eng','PM Compliance',()=>pmPct('eng'),T.pm,'%',0,'pm'],['eng','Asset Uptime',uptime,T.uptime,'%',0,'uptime'],['eng','Statutory Compliance',()=>compPct('eng'),T.comp,'%',0,'comp'],
  ['fac','SLA งานแจ้งซ่อม',()=>slaPct('fac'),T.sla,'%',0,'sla'],['fac','PM Compliance (อาคาร)',()=>pmPct('fac'),T.pm,'%',0,'pm'],['fac','Life-safety Compliance',()=>compPct('fac'),T.comp,'%',0,'comp'],['fac','Defect Closure',defClose,T.defect,'%',0,'defect'],
  ['hk','SLA งานแจ้ง',()=>slaPct('hk'),T.sla,'%',0,'sla'],['hk','Cleanliness Score (30 วัน)',()=>hkScore(),T.hk,'%',0,'hk'],['hk','Task Completion',hkDone,T.hkTask,'%',0,'hkTask'],
  ['sec','SLA งานแจ้ง',()=>slaPct('sec'),T.sla,'%',0,'sla'],['sec','Patrol Compliance (7 วัน)',()=>patrolPct(),T.patrol,'%',0,'patrol'],['sec','Incident Closure',incClose,T.incident,'%',0,'incident'],
  ['pest','SLA งานแจ้ง',()=>slaPct('pest'),T.sla,'%',0,'sla'],['pest','Station Clean Rate',pestPct,T.pest,'%',0,'pest'],
  ['gdn','SLA งานแจ้ง',()=>slaPct('gdn'),T.sla,'%',0,'sla'],['gdn','Zone Health',gdnPct,T.gdn,'%',0,'gdn'],['gdn','Task On-time',gdnOnTime,T.gdnTask,'%',0,'gdnTask'],
  ['lin','SLA งานแจ้ง',()=>slaPct('lin'),T.sla,'%',0,'sla'],['lin','Linen Availability',linPct,T.lin,'%',0,'lin'],['lin','Reject + Lost Rate',linLoss,T.linLoss,'%',1,'linLoss'],
].concat((D.kpiCustom||[]).map(c=>[c.service,c.name,()=>(c.actual===''||c.actual==null)?null:+c.actual,+c.target||0,c.unit||'',c.dir==='≤'?1:0,c.id,true])).filter(k=>svcOn(k[0]))}
const scoreColor=v=>v>=90?'var(--green)':v>=75?'var(--yellow)':'var(--red)';
const openWR=svc=>D.tickets.filter(t=>(svc?t.service===svc:svcOn(t.service))&&t.status!=='Closed'&&t.status!=='Completed').length;

function alerts(){const A=[];
  D.tickets.forEach(t=>{const s=slaOf(t);if(s.s==='breach'&&s.open)A.push({lv:'red',svc:t.service,m:`${t.id} เกิน SLA — ${t.desc}`,s:`${t.area} · ${t.priority}`,v:'helpdesk'})});
  D.assets.filter(a=>a.status==='Down').forEach(a=>A.push({lv:'red',svc:'eng',m:`${a.name} หยุดทำงาน`,s:`${a.area} · Criticality ${a.crit}`,v:'eng'}));
  compRows().filter(c=>c.status==='Overdue').forEach(c=>A.push({lv:'red',svc:c.service,m:`Compliance เลยกำหนด: ${c.item}`,s:`${c.standard} · ครบ ${fmtD(c._nextDue)}`,v:c.service}));
  D.defects.filter(d=>d.status!=='Closed'&&(d.severity==='Critical'||d.target<todayS)).forEach(d=>A.push({lv:d.severity==='Critical'?'red':'yellow',svc:'fac',m:`Defect ${d.element}: ${d.desc}`,s:`${d.area} · กำหนด ${fmtD(d.target)}`,v:'fac'}));
  D.pestSt.filter(s=>s.activity==='High').forEach(s=>A.push({lv:'yellow',svc:'pest',m:`พบความเคลื่อนไหวสูง — ${s.type}`,s:`${s.id} · ${s.area}`,v:'pest'}));
  D.linenItems.map(SCH.linenItems.derive).filter(x=>x._avail<90).forEach(x=>A.push({lv:'yellow',svc:'lin',m:`ผ้าต่ำกว่า Par: ${x.name}`,s:`Availability ${x._avail}%`,v:'lin'}));
  compRows().filter(c=>c.status==='Due Soon').forEach(c=>A.push({lv:'blue',svc:c.service,m:`ใกล้ครบกำหนด: ${c.item}`,s:`อีก ${c._dl} วัน`,v:c.service}));
  if(typeof siContractAlert==='function'&&(cap('set')||myRole()==='client')){const x=siContractAlert();if(x)A.push(x)}
  const o={red:0,yellow:1,blue:2};return A.filter(a=>!SVC[a.svc]||svcOn(a.svc)).sort((a,b)=>o[a.lv]-o[b.lv]);
}

const kpi=(l,v,s,c)=>`<div class="kpi" style="--kc:${c||'var(--accent)'}"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div><div class="kpi-s">${s||''}</div></div>`;

function head(svc,sub,actions=''){const S=SVC[svc];return`<div class="sec-head"><div><div class="sec-title"><span>${S.ic}</span>${S.n} <span class="pill pill-${S.type.toLowerCase()}">${S.type} Service</span></div><div class="sec-sub">${S.th} · ${sub}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${actions}<button class="btn btn-ghost btn-sm" onclick="quickWR('${svc}')">+ แจ้งงาน ${S.n}</button></div></div>`}
function chartBox(id,cfg,h=250){Q.push(()=>mkChart(id,cfg()));return`<div class="chart-wrap" style="height:${h}px"><canvas id="${id}" role="img" aria-label="chart"></canvas></div>`}
function card(t,body,sub=''){return`<div class="card"><div class="card-t">${t}${sub?`<small>${sub}</small>`:''}</div>${body}</div>`}
function tabs(vid,list){const act=list.find(t=>t.k===UI.tab[vid])?UI.tab[vid]:list[0].k;const gear=SVC[vid]&&cap('set')?`<button class="btn btn-ghost btn-sm mod-gear" onclick="msetOpen('${vid}')" title="ตั้งค่าการคำนวณ 5 ตัววัด และ Database ของ Module">⚙ ตั้งค่า Module</button>`:'';
  return`<div class="tabs-row" id="tabs-${vid}"><div class="tabs" role="tablist">${list.map(t=>`<button class="tab ${t.k===act?'active':''}" role="tab" onclick="UI.tab['${vid}']='${t.k}';render()">${t.l}</button>`).join('')}</div>${gear}</div>${list.find(t=>t.k===act).h()}`}
function metricGo(svc,tab){const has={eng:['pm','wr','om'],fac:['pm','wr']}[svc]||['wr'];UI.tab[svc]=has.includes(tab)?tab:'wr';render();setTimeout(()=>{const t=document.getElementById('tabs-'+svc);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})},60)}
function barRow(label,v,color,right){return`<div class="metric-row"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${label}</div><div class="bar"><i style="width:${Math.min(100,v)}%;background:${color}"></i></div></div><div style="font-family:var(--font-display);font-size:16px;font-weight:700;color:${color};min-width:52px;text-align:right">${right??v+'%'}</div></div>`}

function mkChart(id,cfg){if(charts[id]){charts[id].destroy();delete charts[id]}const c=document.getElementById(id);if(c&&window.Chart)charts[id]=new Chart(c,cfg)}
function chartTheme(){if(!window.Chart)return;Chart.defaults.color=tok('--text2');Chart.defaults.borderColor=tok('--grid');Chart.defaults.font.family="'Sarabun',sans-serif";Chart.defaults.font.size=11}
const axOpts=(extra={})=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,boxHeight:10}}},scales:{x:{grid:{color:tok('--grid')}},y:{grid:{color:tok('--grid')},beginAtZero:true}},...extra});
const pieOpts=()=>({responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,boxHeight:10}}}});
const colorOf=n=>({green:'#22C55E',yellow:'#EAB308',red:'#EF4444',blue:'#3B82F6',teal:'#14B8A6',purple:'#A855F7',orange:'#F97316',gray:'#8B949E'}[n]);
function countBy(rows,k){const o={};rows.forEach(r=>{o[r[k]]=(o[r[k]]||0)+1});return o}
function doughnutFrom(obj,order){const keys=order?order.filter(k=>obj[k]):Object.keys(obj);return{type:'doughnut',data:{labels:keys,datasets:[{data:keys.map(k=>obj[k]),backgroundColor:keys.map(k=>colorOf(BC[k])||'#8B949E'),borderWidth:0}]},options:pieOpts()}}

let siteDelArm='';
async function siteDel(btn){const code=gasSite();if(!code||!cap('gas')){denied();return}
  if(siteDelArm!==code){siteDelArm=code;btn.textContent='⚠ กดอีกครั้งเพื่อยืนยันลบ '+code;btn.className='btn btn-danger btn-sm';setTimeout(()=>{if(siteDelArm===code){siteDelArm='';if(btn.isConnected){btn.textContent='🗑 ลบอาคาร '+code+' ออกจากระบบ';btn.className='btn btn-ghost btn-sm';btn.style.color='var(--red)'}}},4000);return}
  siteDelArm='';btn.disabled=true;btn.textContent='กำลังลบ…';
  try{const j=await gasCall('siteDelete',{site:code});clearTimeout(SYNC.t);
    ['psd_ifm_v1_'+BIZK+'@'+code,'psd_ifm_synch_'+BIZK+'_'+code,'psd_ifm_syncrow_'+BIZK+'_'+code,'psd_ifm_siteurl_'+BIZK+'_'+code].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
    LS.set('psd_ifm_site_'+BIZK,'');await authRefresh();const nx=mySitesFor(BIZK)[0];LS.set('psd_ifm_site_'+BIZK,nx?nx.site:'');load();SYNC.last=null;buildChrome();render();if(nx)syncBoot(()=>{buildChrome();render()});
    toast('🗑 ลบอาคาร '+code+' แล้ว'+(j.users?' · ถอดสิทธิ์ '+j.users+' ผู้ใช้':'')+(nx?' · เปลี่ยนเป็น '+nx.site:''))}
  catch(e){toast('❌ '+e.message);btn.disabled=false;btn.textContent='🗑 ลบอาคาร '+code+' ออกจากระบบ'}}

  const r=rng(BIZK+'-om-v1'),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),pick=a=>a[Math.floor(r()*a.length)],person=()=>pick(FN)+' '+pick(LN);

/* ---------- quality metrics (iMATOMs Reliability Module v1.3 formulas) ----------
   MTTR            = Σ repair hours ÷ closed jobs                     (repair = report/respond → completed)
   MTBF            = (Operating hours − Downtime) ÷ Failures           (operating hours = period × hrs/day)
   Availability    = Operational: (Operating − Downtime) ÷ Operating  |  Inherent: MTBF ÷ (MTBF + MTTR)
   Maintainability = 1 − e^(−Target repair time ÷ MTTR)
   Reliability     = e^(−Test time ÷ MTTF), MTTF = [Duty cycle − Repair time/Count] × Load factor,
                     Duty cycle = hrs/day × working days/yr            (alt: e^(−Test time ÷ MTBF)) */
function modUnits(svc){const C=modCalc(svc);if(+C.units>0)return +C.units;return Math.max(1,{eng:D.assets.length,fac:D.areas.length,hk:D.areas.length,sec:modList('sec','posts').length,pest:D.areas.length,gdn:D.gdnZones.length,lin:D.linenItems.length}[svc]||1)}
function relCalc(C,list,units){units=Math.max(1,units||1);
  const since=addD(todayS,-C.periodDays);const t=list.filter(x=>String(x.date).slice(0,10)>=since&&(C.countP4||x.priority!=='P4'));
  const rh=t.filter(x=>x.completedAt).map(x=>{const s=new Date(C.mttrFrom==='respond'&&x.respondedAt?x.respondedAt:x.date),e=new Date(x.completedAt);return Math.max(0,(e-s)/36e5)});
  const fails=t.length,down=rh.reduce((s,v)=>s+v,0),mttr=rh.length?down/rh.length:null,op=C.periodDays*C.hrsDay*units;
  const mtbf=fails?Math.max(0,(op-down)/fails):op;
  const availOp=op?Math.max(0,Math.min(100,(op-down)/op*100)):100,availIn=mttr!=null&&mtbf+mttr>0?mtbf/(mtbf+mttr)*100:100;
  const maint=mttr?(1-Math.exp(-C.maintTarget/mttr))*100:100;
  const duty=C.hrsDay*C.workDays,mttf=Math.max(1,(duty-(mttr||0))*C.load/100);
  const rel=C.relMethod==='mtbf'?(mtbf>0?Math.exp(-C.testTime/mtbf)*100:0):Math.exp(-C.testTime/mttf)*100;
  return{units,mttr,mtbf,avail:C.availMethod==='inherent'?availIn:availOp,availOp,availIn,maint,rel,mttf,duty,down,fails,done:rh.length,op,C,noFail:!fails}}
function relMetrics(svc){return relCalc(modCalc(svc),D.tickets.filter(x=>x.service===svc),modUnits(svc))}
function relBySys(svc){const C=modCalc(svc),g={};D.tickets.filter(x=>x.service===svc).forEach(x=>{(g[x.category||'—']=g[x.category||'—']||[]).push(x)});
  const mu=modUnits(svc);return Object.entries(g).map(([k,l])=>Object.assign({sys:k},relCalc(C,l,svc==='eng'?Math.max(1,D.assets.filter(a=>a.system===k).length):mu))).filter(r=>r.fails>0).sort((a,b)=>a.rel-b.rel)}
const RM_DEF=[['rel','Reliability','%','pm','PM Plan'],['maint','Maintainability','%','wr','Work Request'],['avail','Availability','%','om','Operation'],['mtbf','MTBF','h','pm','PM Plan'],['mttr','MTTR','h','wr','Work Request']];
function rmOk(k,v,C){if(v==null)return null;return k==='mttr'?v<=C.t.mttr:v>=C.t[k]}
function rmFmt(k,v){if(v==null)return'—';return k==='mtbf'||k==='mttr'?(v>=100?Math.round(v).toLocaleString():v.toFixed(1)):v.toFixed(1)}
function metricStrip(svc,go){const M=relMetrics(svc),C=M.C;
  return`<div class="rm-strip">${RM_DEF.map(([k,l,u,tab,tl])=>{const v=M[k],ok=rmOk(k,v,C),col=ok==null?'var(--bcs-muted)':ok?'#22C55E':'#EF4444';
    return`<button class="rm-card" style="--rc:${col}" onclick="${go}('${svc}','${tab}')" title="${l} — เปิดหน้า ${tl}"><span class="rm-l">${l}</span><span class="rm-v">${rmFmt(k,v)}<small>${u}</small>${k==='mtbf'&&M.noFail?'<small> +</small>':''}</span><span class="rm-s">${k==='mttr'?'≤':'≥'} ${C.t[k]}${u} · <u>${tl}</u></span></button>`}).join('')}</div>`}
function relPanel(svc,focus){const M=relMetrics(svc),C=M.C,rows=relBySys(svc),f=k=>focus.includes(k);const n=x=>x==null?'—':(+x).toLocaleString(undefined,{maximumFractionDigits:2});
  const lines={rel:C.relMethod==='mtbf'?`Reliability = e^(−${n(C.testTime)} ÷ MTBF ${n(M.mtbf)}) = <b>${M.rel.toFixed(2)}%</b>`:`Duty cycle = ${n(C.hrsDay)} h × ${n(C.workDays)} d = ${n(M.duty)} h · MTTF = (${n(M.duty)} − ${n(M.mttr||0)}) × ${n(C.load)}% = ${n(M.mttf)} h<br>Reliability = e^(−${n(C.testTime)} ÷ ${n(M.mttf)}) = <b>${M.rel.toFixed(2)}%</b>`,
    mtbf:`Operating = ${n(C.periodDays)} d × ${n(C.hrsDay)} h × ${n(M.units)} หน่วย = ${n(M.op)} h · MTBF = (${n(M.op)} − ${n(M.down)}) ÷ ${n(M.fails)} ครั้ง = <b>${n(M.mtbf)} h</b>${M.noFail?' (ไม่มีความเสียหายในช่วงนี้)':''}`,
    maint:`Maintainability = 1 − e^(−${n(C.maintTarget)} ÷ MTTR ${n(M.mttr)}) = <b>${M.maint.toFixed(2)}%</b>`,
    mttr:`MTTR = ${n(M.down)} h ÷ ${n(M.done)} งานที่ปิด = <b>${n(M.mttr)} h</b> (นับจาก${C.mttrFrom==='respond'?'เวลารับงาน':'เวลาแจ้ง'} → แล้วเสร็จ)`,
    avail:(C.availMethod==='inherent'?'':`Operating = ${n(C.periodDays)} d × ${n(C.hrsDay)} h × ${n(M.units)} หน่วย<br>`)+(C.availMethod==='inherent'?`Availability (Inherent) = MTBF ÷ (MTBF + MTTR) = ${n(M.mtbf)} ÷ (${n(M.mtbf)} + ${n(M.mttr||0)}) = <b>${M.avail.toFixed(2)}%</b>`:`Availability (Operational) = (${n(M.op)} − ${n(M.down)}) ÷ ${n(M.op)} = <b>${M.avail.toFixed(2)}%</b>`)};
  return`<div class="rm-panel"><div class="rm-ph"><b>📐 ${focus.map(k=>RM_DEF.find(x=>x[0]===k)[1]).join(' · ')}</b><span>ช่วง ${C.periodDays} วันล่าสุด · ${M.fails} ครั้ง · Downtime ${n(M.down)} h · ปรับการคำนวณที่ ⚙ ตั้งค่า Module</span></div>
  <div class="rm-formula">${focus.map(k=>`<div>${lines[k]}</div>`).join('')}</div>
  ${rows.length?`<div class="rm-tw"><table class="rm-t"><thead><tr><th>ระบบ / หมวด</th><th>ครั้ง</th><th>Downtime (h)</th>${RM_DEF.map(([k,l])=>`<th class="${f(k)?'hl':''}">${l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.sys)}</td><td>${r.fails}</td><td>${n(r.down)}</td>${RM_DEF.map(([k,,u])=>{const ok=rmOk(k,r[k],C);return`<td class="${f(k)?'hl':''}" style="color:${ok==null?'inherit':ok?'#22C55E':'#EF4444'}">${rmFmt(k,r[k])}${r[k]==null?'':u}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="rm-empty">ยังไม่มีงานในช่วงเวลานี้</div>'}</div>`}

function omLogSigInit(){const cv=document.getElementById('oml-sig');if(!cv)return;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
  if(OML.rec.sig&&String(OML.rec.sig).startsWith('data:')){const im=new Image();im.onload=()=>c.drawImage(im,0,0,cv.width,cv.height);im.src=OML.rec.sig}
  c.lineWidth=2.4;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#0F172A';let dn=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};
  cv.addEventListener('pointerdown',e=>{dn=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);c.beginPath();c.moveTo(x,y);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!dn)return;const[x,y]=pt(e);c.lineTo(x,y);c.stroke();OML.sigDirty=true;e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{dn=false}))}
function omLogSigClear(){const cv=document.getElementById('oml-sig');if(!cv)return;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);OML.rec.sig='';OML.sigDirty=false}

    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);if(OML.rec.photos.length<2)OML.rec.photos.push(cv.toDataURL('image/jpeg',.62));omLogRender()};
  im.onerror=()=>{const e=document.getElementById('oml-err');if(e)e.textContent='อ่านไฟล์รูปไม่ได้'};im.src=url}

/* ---------- Google Apps Script / Sheets sync ---------- */
const SYNC={busy:false,pulling:false,t:null,status:'off',msg:'',last:null,again:false,onStatus:null};
const SYNC_CFG_KEYS=['_v','site','created','hist','svcOff','targetOv','modCfg','bldg','siteInfo'];
const SYNC_ENTS=()=>Object.keys(SCH).filter(k=>Array.isArray(D[k]));
function gasCfg(){return Object.assign({url:'',key:'',auto:true},LS.get('psd_ifm_gas',{}))}
function gasSite(){return LS.get('psd_ifm_site_'+BIZK,'')}
function gasReady(){const c=gasCfg();return!!(c.url&&gasSite()&&(typeof DMODE!=='function'||DMODE()!=='sample')&&((typeof sessTok==='function'&&sessTok())||c.key))}
function syncHashKey(){return'psd_ifm_synch_'+BIZK+'_'+gasSite()}
function syncBaseKey(){return'psd_ifm_syncrow_'+BIZK+'_'+gasSite()}
const rowMap=a=>{const m={};(a||[]).forEach(r=>{m[String(r.id)]=hashOf(JSON.stringify(r))});return m};
function hashOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
function setSyncStatus(st,msg){SYNC.status=st;SYNC.msg=msg||'';if(st==='ok')SYNC.last=new Date();SYNC.onStatus&&SYNC.onStatus(st,msg)}
async function gasCall(action,body){const c=gasCfg();if(!c.url)throw new Error('ยังไม่ได้ใส่ Web App URL');
  const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:(typeof sessTok==='function'&&sessTok())||undefined,key:c.key||undefined,site:gasSite(),business:BIZK,siteName:D&&D.site},body||{}))});
  let j;try{j=await res.json()}catch(e){throw new Error('Web App ตอบกลับไม่ใช่ JSON — ตรวจ URL และสิทธิ์ Deploy (Anyone)')}if(!j.ok){const er=new Error(j.error||'Request failed');er.auth=!!j.auth;if(j.auth&&action!=='login'&&typeof authExpired==='function')setTimeout(()=>authExpired(j.error),0);throw er}return j}
function syncNormalize(tables){Object.entries(tables||{}).forEach(([e,rows])=>{const S=SCH[e];if(!S||!Array.isArray(rows))return;const nums=S.fields.filter(f=>f.t==='number').map(f=>f.k);
  rows.forEach(r=>{nums.forEach(k=>{if(r[k]!==''&&r[k]!=null&&!isNaN(+r[k]))r[k]=+r[k]});Object.keys(r).forEach(k=>{if(r[k]==null)r[k]=''})})});return tables}
async function syncPush(all){if(!gasReady())return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;setSyncStatus('busy');
  try{const H=all?{}:LS.get(syncHashKey(),{}),nh=Object.assign({},H),tables={},base=LS.get(syncBaseKey(),{});
    SYNC_ENTS().forEach(e=>{if(typeof canPushEnt==='function'&&!canPushEnt(e))return;const h=hashOf(JSON.stringify(D[e]));if(H[e]===h)return;nh[e]=h;
      if(all||!base[e]){tables[e]={rows:D[e],full:true};return}
      const b=base[e],ids=new Set();const rows=D[e].filter(r=>{const id=String(r.id);ids.add(id);return b[id]!==hashOf(JSON.stringify(r))});
      const deleted=Object.keys(b).filter(id=>!ids.has(id));if(rows.length||deleted.length)tables[e]={rows,deleted,full:false}});
    const cfg={};SYNC_CFG_KEYS.forEach(k=>{if(D[k]!==undefined)cfg[k]=D[k]});const ch=hashOf(JSON.stringify(cfg)),sendCfg=H._cfg!==ch&&(typeof cap!=='function'||cap('set'));nh._cfg=ch;
    if(!Object.keys(tables).length&&!sendCfg){setSyncStatus('ok');return}
    const j=await gasCall('push',{tables,config:sendCfg?cfg:null,summary:sendCfg&&D.siteInfo&&typeof siSummary==='function'?siSummary():undefined});
    let merged=false;if(j.tables&&typeof j.tables==='object'){syncNormalize(j.tables);Object.entries(j.tables).forEach(([e,rows])=>{if(!Array.isArray(rows)||!SCH[e])return;D[e]=rows;nh[e]=hashOf(JSON.stringify(D[e]));merged=true});LS.set(DKEY(),D)}
    Object.keys(tables).forEach(e=>{base[e]=rowMap(D[e])});LS.set(syncBaseKey(),base);if(merged&&j.tables&&Object.keys(j.tables).some(e=>!tables[e]||!tables[e].full))SYNC.onMerge&&SYNC.onMerge();
    if(j.url)LS.set('psd_ifm_siteurl_'+BIZK+'_'+gasSite(),j.url);
    LS.set(syncHashKey(),nh);setSyncStatus('ok')}
  catch(e){setSyncStatus('err',e.message)}finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;setTimeout(()=>syncPush(),300)}}}
function syncAfterSave(){if(!gasReady()||!gasCfg().auto||SYNC.pulling)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>syncPush(),2500)}
async function syncPull(){if(!gasReady())return false;SYNC.pulling=true;setSyncStatus('busy');
  try{const j=await gasCall('pull');if(j.url)LS.set('psd_ifm_siteurl_'+BIZK+'_'+gasSite(),j.url);
    if(j.empty){SYNC.pulling=false;if(typeof cap==='function'&&!cap('set')){setSyncStatus('err','Sheet ของอาคารนี้ยังว่าง — รอ Admin / FM ส่งข้อมูลตั้งต้น');return false}await syncPush(true);return false}
    const nd=Object.assign({},D,j.config||{},syncNormalize(j.tables||{}));nd._v=1;D=nd;ensureD();LS.set(DKEY(),D);
    const nh={},base={};SYNC_ENTS().forEach(e=>{nh[e]=hashOf(JSON.stringify(D[e]));base[e]=rowMap(D[e])});LS.set(syncBaseKey(),base);const cfg={};SYNC_CFG_KEYS.forEach(k=>{if(D[k]!==undefined)cfg[k]=D[k]});nh._cfg=hashOf(JSON.stringify(cfg));LS.set(syncHashKey(),nh);
    setSyncStatus('ok');return true}

    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}

function gasStatusText(){const st=SYNC.status;if(DMODE()==='sample')return'🧪 กำลังใช้ข้อมูลตัวอย่าง — ไม่ซิงค์ Google Sheets (เปลี่ยนเป็น “ข้อมูลจริง” ด้านบนเพื่อซิงค์)';if(!gasReady())return'ยังไม่ได้เชื่อมต่อ — ข้อมูลอยู่ในเบราว์เซอร์นี้เท่านั้น';if(st==='busy')return'⏳ กำลังซิงค์…';if(st==='err')return'<span style="color:var(--red)">❌ '+esc(SYNC.msg)+'</span>';if(SYNC.last)return'<span style="color:var(--green)">✅ ซิงค์ล่าสุด '+SYNC.last.toLocaleTimeString('th-TH')+'</span>';return gasCfg().auto?'เชื่อมต่อแล้ว · ซิงค์อัตโนมัติ':'เชื่อมต่อแล้ว · ซิงค์ด้วยตนเอง'}
function gasReadForm(){const g=id=>document.getElementById(id);const c={url:g('gas-url').value.trim(),key:g('gas-key').value.trim(),auto:g('gas-auto').checked};LS.set('psd_ifm_gas',c);
  const site=g('gas-site').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');const oldSite=gasSite();LS.set('psd_ifm_site_'+BIZK,site);g('gas-site').value=site;if(site!==oldSite)load();if((sess()||{}).mode!==(authOnline()?'online':'local'))setTimeout(()=>authLogout(authOnline()?'เชื่อม Google Sheets แล้ว — เข้าสู่ระบบด้วยบัญชีบน Sheets (admin + รหัสจาก Execution log)':'เปลี่ยนเป็นโหมดสาธิต — กรุณาเข้าสู่ระบบอีกครั้ง'),0);return c}

async function gasPushAll(){gasReadForm();if(!gasReady()){toast('ตั้งค่า URL, API Key และ Site Code ให้ครบก่อน');return}await syncPush(true);toast(SYNC.status==='ok'?'⬆ ส่งข้อมูลทั้งหมดขึ้น Sheet แล้ว':'❌ '+SYNC.msg);render()}
let gasPullArm=false;

/* ═══════════════════════════════════════════════════════════════════
   BUILDING CRITICAL STATUS (BCS) — shared by IFM desktop + IFM mobile
   Ported from iMATOMs v3.0 Building Critical Status:
   3D building (3 styles + 2D) · per-floor plan (3D / 2D) · 4-Ring System
   IFM 4-Ring is evaluated per AREA:
     วง 1 WR   — open work requests (all services) · red = over SLA / P1
     วง 2 HARD — assets Down / Warning · open building defects
     วง 3 PPM  — PM overdue / due in 7 days · missed housekeeping tasks
     วง 4 SOFT — cleanliness below target · pest activity · security incidents
   Data: D.bldg.floors / D.bldg.rooms (inside the shared IFM data store),
         floor-plan images in localStorage 'psd_ifm_plan_<biz>_<floor>'.
   ═══════════════════════════════════════════════════════════════════ */
const BR_COL=['#F97316','#06B6D4','#A855F7','#EC4899'];
const BR_KEY=['r1','r2','r3','r4'];
const BR_NAME=['WR','HARD','PPM','SOFT'];
const BR_DESC=[['งานแจ้งซ่อม / แจ้งบริการค้าง','Open work requests'],['อุปกรณ์ Down/Warning · Defect ระดับ Medium+','Assets down / warning · defects Medium+'],['PM เกิน/ครบใน 7 วัน · งานแม่บ้าน Missed','PM overdue / due 7 days · missed HK'],['ความสะอาดตรวจล่าสุด < 85% · Pest ระดับ High · เหตุ รปภ. Medium+','Cleanliness < 85% · pest High · incidents Medium+']];
const BR_GO=['helpdesk','eng','eng','hk'];
const BCS={sel:null,ring:'r1',edit:false,kind:'desk',host:{},st:null,rd:null,rows:[]};
const bT=(th,en)=>(BCS.host.lang&&BCS.host.lang()==='en')?en:th;
function bLS(k,d){try{const v=localStorage.getItem('psd_ifm_'+k);return v==null?d:v}catch(e){return d}}
function bLSset(k,v){try{localStorage.setItem('psd_ifm_'+k,v)}catch(e){}}
const bIsBase=c=>/^B\d+$/i.test(String(c).trim());
const bOK=n=>({bad:0,c:'#22C55E',k:0,n});

/* ---------- floors ---------- */
function bcsName(c){c=String(c);if(/^roof$/i.test(c))return'Roof Level';if(/^g$/i.test(c))return'Ground Floor (G)';if(bIsBase(c))return'ชั้น '+c.toUpperCase();if(/^\d+$/.test(c))return'ชั้น '+c;return c}
function bcsMakeFloors(b,t,roof,prev){
  b=Math.max(0,Math.min(10,b|0));t=Math.max(1,Math.min(80,t|0));
  const codes=[];if(roof)codes.push('Roof');for(let n=t;n>=2;n--)codes.push(String(n));codes.push('G');for(let n=1;n<=b;n++)codes.push('B'+n);
  const old={};(prev||[]).forEach(f=>old[String(f.code).toUpperCase()]=f.name);
  return codes.map((c,i)=>({id:c.toUpperCase(),code:c,name:old[c.toUpperCase()]||bcsName(c),order:codes.length-i}))}
function bcsTokens(s){return String(s||'').toUpperCase().split(/[-–,\/]/).map(x=>x.trim()).filter(Boolean)}
function bcsAutoFloors(){let b=0,t=1,roof=false;
  D.areas.forEach(a=>bcsTokens(a.floor).forEach(x=>{if(x==='ROOF')roof=true;else{const m=x.match(/^B(\d+)$/);if(m)b=Math.max(b,+m[1]);else if(/^\d+$/.test(x))t=Math.max(t,+x)}}));
  return bcsMakeFloors(b,t,roof,[])}
function bcsFloors(){if(!D.bldg)D.bldg={floors:[],rooms:{}};if(!D.bldg.rooms)D.bldg.rooms={};if(!D.bldg.floors||!D.bldg.floors.length)D.bldg.floors=bcsAutoFloors();return D.bldg.floors.slice().sort((a,b)=>b.order-a.order)}
function bcsFloorById(id){return bcsFloors().find(f=>f.id===id)}
function bcsAreaFloor(a){const fl=bcsFloors(),ids=new Set(fl.map(f=>f.id));
  for(const x of bcsTokens(a.floor)){if(ids.has(x))return x;if((x==='1'||/^(GF|G\/F|GROUND|L1)$/.test(x))&&ids.has('G'))return'G'}
  return ids.has('G')?'G':(fl[fl.length-1]||{}).id}

/* ---------- 4-ring per area ---------- */
function bcsOpenWR(t){return t.status!=='Closed'&&t.status!=='Completed'}
function bcsAreaRS(a){
  const n=a.name,T=P().target,in7=addD(todayS,7);
  const ow=D.tickets.filter(t=>t.area===n&&bcsOpenWR(t)&&svcOn(t.service));
  const crW=ow.filter(t=>t.priority==='P1'||slaOf(t).s==='breach');
  const as=svcOn('eng')?D.assets.filter(x=>x.area===n):[];
  const down=as.filter(x=>x.status==='Down'),warn=as.filter(x=>x.status==='Warning');
  const df=svcOn('fac')?D.defects.filter(d=>d.area===n&&d.status!=='Closed'&&d.severity!=='Low'):[];
  const items=new Set(as.map(x=>x.name).concat([n]));
  const pmO=D.pm.filter(p=>svcOn(p.service)&&items.has(p.item)&&p.status!=='Done'&&p.dueDate<todayS);
  const pm7=D.pm.filter(p=>svcOn(p.service)&&items.has(p.item)&&p.status!=='Done'&&p.dueDate>=todayS&&p.dueDate<=in7);
  const hkM=svcOn('hk')?D.hkTasks.filter(h=>h.area===n&&h.status==='Missed'):[];
  const ins=svcOn('hk')?D.hkInsp.filter(x=>x.area===n&&x.date>=addD(todayS,-30)):[];const hkA=ins.length?avg(ins.map(x=>x.score)):null;
  const pst=svcOn('pest')?D.pestSt.filter(s=>s.area===n&&s.activity==='High'):[];
  const inc=svcOn('sec')?D.secInc.filter(s=>s.area===n&&s.status!=='Closed'&&s.severity!=='Low'):[];
  const hkLast=ins.slice().sort((x,y)=>y.date.localeCompare(x.date))[0];const hkLow=hkA!=null&&((hkLast&&+hkLast.score<85)||hkA<Math.min(T.hk,90)-5);
  const j=a=>a.filter(Boolean).join(' · ');
  const r1=ow.length?{bad:1,c:crW.length?'#EF4444':BR_COL[0],k:ow.length,n:crW.length?j([bT('เกิน SLA/P1 ','Over SLA/P1 ')+crW.length,bT('เปิด ','open ')+ow.length]):bT('WR เปิด ','Open WR ')+ow.length}:bOK(bT('ไม่มีงานค้าง','No open WR'));
  const k2=down.length+warn.length+df.length;
  const r2=k2?{bad:1,c:BR_COL[1],k:k2,n:j([down.length&&'Down '+down.length,warn.length&&'Warning '+warn.length,df.length&&'Defect '+df.length])}:bOK(bT('อุปกรณ์/อาคารปกติ','Assets & fabric OK'));
  const k3=pmO.length+pm7.length+hkM.length;
  const r3=k3?{bad:1,c:BR_COL[2],k:k3,n:j([pmO.length&&bT('PM เกินกำหนด ','PM overdue ')+pmO.length,pm7.length&&bT('PM ใน 7 วัน ','PM in 7d ')+pm7.length,hkM.length&&bT('แม่บ้าน Missed ','HK missed ')+hkM.length])}:bOK(bT('ตามแผน','On plan'));
  const k4=(hkLow?1:0)+pst.length+inc.length;
  const r4=k4?{bad:1,c:BR_COL[3],k:k4,n:j([hkLow&&bT('ความสะอาด ','Clean ')+hkA+'%',pst.length&&'Pest '+pst.length+bT(' จุด',' pts'),inc.length&&bT('เหตุ รปภ. ','Incident ')+inc.length])}:bOK(bT('ปกติ','Normal'));
  const crit=crW.length>0||down.length>0||df.some(d=>d.severity==='Critical')||pst.some(s=>s.activity==='High');
  return{r1,r2,r3,r4,crit,bad:!!(r1.bad||r2.bad||r3.bad||r4.bad),ow,as,down,warn,df,pmO,pm7,hkM,hkA,pst,inc}}
function bcsFloorStatus(){const out={};bcsFloors().forEach(f=>out[f.id]={n:0,r1:0,r2:0,r3:0,r4:0,crit:0,bad:false,items:[]});
  D.areas.forEach(a=>{const o=out[bcsAreaFloor(a)];if(!o)return;const rs=bcsAreaRS(a);o.n++;BR_KEY.forEach(k=>{if(rs[k].bad)o[k]++});if(rs.crit)o.crit++;o.items.push({a,rs})});
  Object.values(out).forEach(o=>o.bad=(o.r1+o.r2+o.r3+o.r4)>0);BCS.st=out;return out}

/* ---------- rooms (areas) on a floor ---------- */
function bcsRooms(fid,svgH){const ar=D.areas.filter(a=>bcsAreaFloor(a)===fid),L=D.bldg.rooms||{},n=ar.length;if(!n)return[];
  const cols=Math.ceil(Math.sqrt(n*1.7)),rows=Math.ceil(n/cols),gx=18,gy=18,pw=820,ph=(svgH||540)-90;
  const w=(pw-(cols-1)*gx)/cols,h=Math.min(260,(ph-(rows-1)*gy)/rows),oy=Math.max(40,((svgH||540)-(rows*h+(rows-1)*gy))/2);
  return ar.map((a,i)=>{const p=L[a.id];if(p)return{a,x:p.x,y:p.y,w:p.w,h:p.h};const c=i%cols,r=Math.floor(i/cols);return{a,x:40+c*(w+gx),y:oy+r*(h+gy),w,h}})}

async function bcsPlanUpload(inp){const file=inp.files[0];inp.value='';if(!file)return;const fid=BCS.sel;const tst=m=>BCS.host.toast&&BCS.host.toast(m);
  if(!fid){tst(bT('เลือกชั้นก่อน','Pick a floor first'));return}
  try{tst(bT('⏳ กำลังประมวลผล floor plan…','⏳ Processing floor plan…'));const MAXW=1600,cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)){if(!window.pdfjsLib){tst(bT('⚠ PDF.js ยังโหลดไม่เสร็จ','⚠ PDF.js not loaded'));return}
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,page=await pdf.getPage(1),v0=page.getViewport({scale:1}),vp=page.getViewport({scale:MAXW/v0.width});
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await page.render({canvasContext:ctx,viewport:vp}).promise}
    else{const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url});const sc=Math.min(1,MAXW/img.naturalWidth);
      cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url)}
    const plan={dataUrl:cv.toDataURL('image/jpeg',.78),svgH:Math.round(cv.height*900/cv.width)};
    try{localStorage.setItem('psd_ifm_plan_'+BIZK+'_'+fid,JSON.stringify(plan))}catch(e){tst(bT('❌ พื้นที่เก็บในเบราว์เซอร์เต็ม — ใช้ไฟล์ขนาดเล็กลง','❌ Browser storage full — use a smaller file'));return}
    tst(bT('✅ อัปโหลด floor plan ของชั้นนี้แล้ว','✅ Floor plan saved for this floor'));bcsRenderFloor(fid)}
  catch(err){tst(bT('❌ อ่านไฟล์ไม่ได้: ','❌ Cannot read file: ')+(err.message||err))}}

const WP_RN={r1:['🛠','WR','งานแจ้งซ่อม / แจ้งบริการค้าง','Open work requests'],r2:['⚙','HARD','อุปกรณ์ Down / Warning · Defect · IoT','Assets · defects · IoT'],r3:['🗓','PPM','แผน PM เกิน / ครบใน 7 วัน · แม่บ้าน Missed','PM overdue / due · HK missed'],r4:['🧹','SOFT','ความสะอาด · Pest · เหตุ รปภ.','Cleanliness · pest · security']};
/* รายการจริงต่อพื้นที่ (ตรรกะเดียวกับ 4-Ring) */
function wpActItems(a,ring){const n=a.name,in7=addD(todayS,7),T=P().target,L=[];
  const row=(ent,id,ic,t,s,lv,due)=>L.push({ent,id,ic,t,s,lv,due,area:n});
  if(ring==='r1')D.tickets.filter(t=>t.area===n&&bcsOpenWR(t)&&svcOn(t.service)).forEach(t=>{const sl=slaOf(t),cr=t.priority==='P1'||sl.s==='breach';row('tickets',t.id,(SVC[t.service]||{ic:'🛠'}).ic,(t.category||'')+(t.desc?' — '+t.desc:''),[t.id,t.priority,t.status,t.assignee&&'👤 '+t.assignee,sl.s==='breach'&&_t('เกิน SLA','SLA breach')].filter(Boolean).join(' · '),cr?'crit':'warn')});
  if(ring==='r2'){const as=svcOn('eng')?D.assets.filter(x=>x.area===n):[];
    as.filter(x=>x.status==='Down'||x.status==='Warning').forEach(x=>row('assets',x.id,'⚙',x.name,[x.system,'Criticality '+(x.crit||'-'),x.status].join(' · '),x.status==='Down'?'crit':'warn'));
    (svcOn('fac')?D.defects.filter(d=>d.area===n&&d.status!=='Closed'&&d.severity!=='Low'):[]).forEach(d=>row('defects',d.id,'🏗',d.element+' — '+d.desc,[d.id,d.severity,d.status,d.target&&_t('กำหนด ','due ')+d.target].filter(Boolean).join(' · '),d.severity==='Critical'?'crit':'warn'));
    iotDevs().filter(d=>d.area===n).forEach(d=>{const e=iotEval(d);if(e.lv==='warn'||e.lv==='crit')L.push({iot:d.id,ic:(IOT_T[d.type]||{ic:'📡'}).ic,t:d.name,s:'IoT · '+e.short,lv:e.lv,area:n})})}
  if(ring==='r3'){const items=new Set((svcOn('eng')?D.assets.filter(x=>x.area===n):[]).map(x=>x.name).concat([n]));
    D.pm.filter(p=>svcOn(p.service)&&items.has(p.item)&&p.status!=='Done'&&p.dueDate<=in7).forEach(p=>{const od=p.dueDate<todayS;row('pm',p.id,'🗓',p.task||p.item,[p.id,p.item!==n&&p.item,(od?_t('เกินกำหนด ','Overdue ')+p.dueDate:_t('ครบกำหนด ','Due ')+p.dueDate),p.freq,p.assignee&&'👤 '+p.assignee].filter(Boolean).join(' · '),od?'warn':'info',p.dueDate)});
    (svcOn('hk')?D.hkTasks.filter(h=>h.area===n&&h.status==='Missed'):[]).forEach(h=>row('hkTasks',h.id,'🧹',h.task,[h.id,_t('แม่บ้าน Missed','HK missed'),h.shift,h.staff&&'👤 '+h.staff].filter(Boolean).join(' · '),'warn'))}
  if(ring==='r4'){if(svcOn('hk')){const ins=D.hkInsp.filter(x=>x.area===n&&x.date>=addD(todayS,-30)).sort((x,y)=>y.date.localeCompare(x.date));const av=ins.length?avg(ins.map(x=>x.score)):null;
      if(av!=null&&((ins[0]&&+ins[0].score<85)||av<Math.min(T.hk,90)-5))row('hkInsp',ins[0].id,'🧽',_t('ความสะอาดต่ำกว่าเกณฑ์','Cleanliness below target'),[_t('ล่าสุด ','last ')+ins[0].score+'%',_t('เฉลี่ย 30 วัน ','30-day avg ')+av+'%',ins[0].inspector&&'👤 '+ins[0].inspector,ins[0].remark].filter(Boolean).join(' · '),'warn')}
    (svcOn('pest')?D.pestSt.filter(s=>s.area===n&&s.activity==='High'):[]).forEach(s=>row('pestSt',s.id,'🐀',_t('พบความเคลื่อนไหวสูง — ','High activity — ')+s.type,[s.id,s.lastCheck&&_t('ตรวจ ','checked ')+s.lastCheck,s.remark].filter(Boolean).join(' · '),'crit'));
    (svcOn('sec')?D.secInc.filter(s=>s.area===n&&s.status!=='Closed'&&s.severity!=='Low'):[]).forEach(s=>row('secInc',s.id,'🛡',s.type,[s.id,s.severity,s.status,s.date].filter(Boolean).join(' · '),s.severity==='High'||s.severity==='Critical'?'crit':'warn'))}
  return L}
function wpDetOpen(fid,ring,aid){WPF.det={fid,ring:ring||'',aid:aid||''};wpDetPaint()}
function wpDetClose(){if(typeof WPF!=='undefined')WPF.det=null;wpDetPaint()}
function wpDetPaint(){const el=document.querySelector('.wpf-sec2');if(el)el.innerHTML=WPF.det?wpfDet():wpfSvc();document.querySelectorAll('.wp-flcard .wp-ring').forEach(b=>b.classList.toggle('sel',!!WPF.det&&b.dataset.k===WPF.det.ring))}
function wpfDet(){const X=WPF.det,f=bcsFloorById(X.fid);if(!f){if(typeof WPF!=='undefined')WPF.det=null;return wpfSvc()}
  const o=(BCS.st||{})[X.fid]||{items:[]},rings=X.ring?[X.ring]:['r1','r2','r3','r4'];
  const areas=o.items.filter(x=>x.rs.bad&&(!X.aid||x.a.id===X.aid));let tot=0;
  const body=rings.map(k=>{const R=WP_RN[k],c=WP_AC[k];const rows=areas.flatMap(x=>x.rs[k]&&x.rs[k].bad?wpActItems(x.a,k):[]);tot+=rows.length;if(!rows.length&&X.ring!==k)return'';
    return`<div class="wpd-g" style="--ac:${c}"><div class="wpd-gh"><i style="background:${c}"></i>${R[0]} <b>${R[1]}</b> <span>${_t(R[2],R[3])}</span><em>${rows.length}</em></div>`+
      (rows.length?rows.map(r=>`<div class="wpd-row ${r.lv}" ${r.iot?`onclick="iotOpen('${esc(r.iot)}')"`:r.ent?`onclick="openForm('${r.ent}','${esc(r.id)}')"`:''}><div class="wpd-r1"><span>${r.ic}</span><b>${esc(String(r.t||'').slice(0,90))}</b>${r.lv==='crit'?`<span class="wpd-cr">⚠ ${_t('วิกฤต','Critical')}</span>`:''}</div><div class="wpd-r2">📍 ${esc(r.area)} · ${esc(r.s||'')}</div></div>`).join(''):`<div class="wpf-empty" style="padding:14px">✅ ${_t('ไม่มีรายการ','Nothing open')}</div>`)+`</div>`}).join('');
  const ttl=X.aid?(o.items.find(x=>x.a.id===X.aid)||{a:{name:''}}).a.name:f.name;
  return`<div class="wpf-sh"><button class="wpd-back" onclick="wpDetClose()" title="${_t('กลับไปรายการบริการ','Back to services')}">←</button>${X.ring?WP_RN[X.ring][0]+' '+WP_RN[X.ring][1]:'📋 '+_t('กิจกรรมทั้งหมด','All activity')} · ${esc(ttl)}<small>${tot} ${_t('รายการ','items')}</small></div>
   <div class="wpd-tabs">${['','r1','r2','r3','r4'].map(k=>{const n=k?(o[k]||0):o.items.filter(x=>x.rs.bad).length;return`<button class="${X.ring===k?'on':''}" ${k?`style="--ac:${WP_AC[k]}"`:''} onclick="wpDetOpen('${X.fid}','${k}','${esc(X.aid)}')">${k?WP_RN[k][1]:_t('ทั้งหมด','All')}${n?` <i>${n}</i>`:''}</button>`}).join('')}</div>
   <div class="wpf-slist">${body||`<div class="wpf-empty">✅ ${_t('ไม่มีกิจกรรมค้างในชั้นนี้','No open activity on this floor')}</div>`}<div class="wpd-hint">${_t('แตะรายการเพื่อดู / แก้ไข / ปิดงานได้ทันที','Tap an item to view / edit / close it')}</div></div>`}
/* floor card: ring chips + area lines clickable */
if(typeof wpFlCard==='function'&&typeof WPF!=='undefined'){const _fc=wpFlCard;wpFlCard=function(){_fc();const c=B3.el&&B3.el.querySelector('.wp-flcard');const fid=BCS.sel;
  if(WPF.det&&WPF.det.fid!==fid){WPF.det=fid?{fid,ring:WPF.det.ring,aid:''}:null;wpDetPaint()}
  if(!c||!fid)return;const LB=['r1','r2','r3','r4'];
  c.querySelectorAll('.wp-flc-r .wp-ring').forEach((b,i)=>{const k=LB[i];b.dataset.k=k;b.style.cursor='pointer';b.title=_t('ดูรายละเอียดกิจกรรม','Show activity details');b.onclick=()=>wpDetOpen(fid,WPF.det&&WPF.det.ring===k&&!WPF.det.aid?'':k)});
  const o=(BCS.st||{})[fid]||{items:[]},bad=o.items.filter(x=>x.rs.bad);
  c.querySelectorAll('.wp-flc-l > div').forEach((d,i)=>{const x=bad[i];if(!x)return;d.style.cursor='pointer';d.classList.add('wpd-al');d.onclick=()=>wpDetOpen(fid,'',x.a.id)});
  if(WPF.det)wpDetPaint()}}

/* ───────── 3D front: แสดงหน้า Module (ข้อมูลหลังบ้าน) ในพื้นที่หลัก ───────── */
if(typeof WPF!=='undefined')WPF.mod=null;
function wpfModOk(){const k=WPF.mod;return!!k&&!!VIEWS[k]&&k!=='front'&&viewOk(k)}
function wpfModOpen(k){WPF.mod=WPF.mod===k?null:k;render();const m=document.querySelector('.wpf-main');if(m)m.scrollTop=0}
function wpfModClose(){WPF.mod=null;render()}
function wpfMod(){const k=WPF.mod,S=SVC[k]||{ic:'📄',n:TITLES[k]||k,c:'#F97316',type:''};let h='';try{h=VIEWS[k]()}catch(e){h=`<div class="au-err">❌ ${esc(e.message)}</div>`}
  const on=SVC_ON();
  return`<div class="wpf-modbar" style="--sc:${S.c}"><button class="wpf-modx" onclick="wpfModClose()">← 🏙 ${_t('กลับหน้า 3D','Back to 3D')}</button>
   <div class="wpf-modt"><span>${S.ic}</span><b>${esc(S.n)}</b>${S.type?`<small>${S.type} Service</small>`:''}</div>
   <div class="wpf-modtabs">${on.map(x=>`<button class="${x===k?'on':''}" style="--sc:${SVC[x].c}" onclick="wpfModOpen('${x}')" title="${esc(SVC[x].n)}">${SVC[x].ic}<span>${esc(SVC[x].n)}</span></button>`).join('')}</div>
   <button class="wpf-modgo" onclick="showView('${k}')" title="${_t('เปิดเต็มจอในหลังบ้าน','Open in back office')}">🗂</button></div>
   <div class="wpf-modbody">${h}</div>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&typeof WPF!=='undefined'&&WPF.mod&&CUR==='front'&&!document.querySelector('.modal-bg.show,.modal.open,.bcs-modal:not([hidden])')){wpfModClose()}});

/* ───────── KPI tiles ตามขอบเขตที่เลือก (แคมปัส › อาคารหลัก › อาคารย่อย › ชั้น) + สรุปแยกรายอาคาร ───────── */
function wpScope(){const all=bcsFloors();
  if(BCS.sel&&bcsFloorById(BCS.sel)){const f=bcsFloorById(BCS.sel);return{lv:'fl',name:(f.blk||'')+' · '+_t('ชั้น ','Fl ')+wpFlLabel(f.id),fl:[f]}}
  if(WPV.blk){const G=wpGrpOf(WPV.blk);return{lv:'blk',name:(G&&G.blocks.length>1?G.name+' › ':'')+WPV.blk,fl:all.filter(f=>f.blk===WPV.blk)}}
  if(WPV.grp){const G=WP_GROUPS.find(x=>x.id===WPV.grp);return{lv:'grp',name:G?G.name:WPV.grp,fl:all.filter(f=>G&&G.blocks.includes(f.blk))}}
  return{lv:'all',name:_t('ทั้งแคมปัส','Whole campus'),fl:all}}
function wpScopeStat(fl){const st=BCS.st||{},ids=new Set(fl.map(f=>f.id)),items=fl.flatMap(f=>(st[f.id]||{items:[]}).items);
  const bad=items.filter(x=>x.rs.bad).length,crit=items.filter(x=>x.rs.crit).length,warn=bad-crit;
  const cf=fl.filter(f=>st[f.id]&&st[f.id].crit).length,af=fl.filter(f=>st[f.id]&&st[f.id].bad).length;
  const nm=new Set(items.map(x=>x.a.name)),wr=D.tickets.filter(t=>bcsOpenWR(t)&&svcOn(t.service)&&nm.has(t.area)),br=wr.filter(t=>slaOf(t).s==='breach').length;
  const cnt={r1:0,r2:0,r3:0,r4:0};fl.forEach(f=>{const o=st[f.id];if(o&&o.bad)WP_AK.forEach(k=>cnt[k]+=+o[k]||0)});
  return{cnt,col:crit?'#EF4444':bad?wpActCol(cnt):'#22C55E',n:items.length,ok:items.length?Math.round((items.length-bad)/items.length*100):100,bad,crit,warn,cf,af,fl:fl.length,wr:wr.length,br}}
function wpScopeKids(sc){const all=bcsFloors();
  if(sc.lv==='all')return WP_GROUPS.map(G=>({k:G.id,lab:G.name.replace('Campus ','').replace('Carpark ',''),fl:all.filter(f=>G.blocks.includes(f.blk)),go:`wpGrpSet('${G.id}')`}));
  if(sc.lv==='grp'){const G=WP_GROUPS.find(x=>x.id===WPV.grp);if(G&&G.blocks.length>1)return G.blocks.map(b=>({k:b,lab:b,fl:all.filter(f=>f.blk===b),go:`wpBlkSet('${b}')`}))}
  const blk=sc.lv==='fl'?bcsFloorById(BCS.sel).blk:WPV.blk||(WP_GROUPS.find(x=>x.id===WPV.grp)||{blocks:[]}).blocks[0];
  return all.filter(f=>f.blk===blk).sort((a,c)=>wpLv(c.id)-wpLv(a.id)).map(f=>({k:f.id,lab:wpFlTag(f.id),fl:[f],go:`bcsSelect('${f.id}')`,on:BCS.sel===f.id}))}
bcsKpis=function(){const el=document.getElementById('bcs-kpis');if(!el)return;const sc=wpScope(),S=wpScopeStat(sc.fl),kids=wpScopeKids(sc).map(x=>Object.assign(x,{S:wpScopeStat(x.fl)}));
  const G1=WPV.blk&&wpGrpOf(WPV.blk),showBr=sc.lv==='all'||(sc.lv==='grp'&&kids.length>1)||((sc.lv==='blk'||sc.lv==='grp')&&G1&&G1.blocks.length===1);
  const br=(fn,col)=>!showBr?'':`<div class="wpk-br">${kids.map(x=>{const v=fn(x.S);return`<span class="${x.on?'on':''} ${v&&v!=='100%'?'hot':''} ${v&&v!=='100%'&&col(x.S)==='#EF4444'?'wpk-blink':''}" style="${v&&v!=='100%'?'--bc:'+col(x.S):''}" onclick="event.stopPropagation();${x.go}" title="${esc(x.lab)}">${esc(x.lab)}(<b>${v}</b>)</span>`}).join('')}</div>`;
  const k=(l,v,s,c,b)=>`<div class="bcs-kpi wpk" style="--kc:${c}"><span>${l}</span><b>${v}</b><small>${s}</small>${b||''}</div>`;
  const tag=`<em class="wpk-sc">${sc.lv==='all'?'🏙':sc.lv==='fl'?'▤':'🏢'} ${esc(sc.name)}</em>`;
  el.innerHTML=
   k(_t('พื้นที่ปกติ','Areas normal')+tag,S.ok+'%',(S.n-S.bad)+'/'+S.n+_t(' พื้นที่',' areas'),S.ok>=90?'#22C55E':S.ok>=70?'#EAB308':'#EF4444',br(x=>x.ok+'%',x=>x.col))+
   k(_t('พื้นที่วิกฤต','Critical areas'),S.crit,_t('ใน ','in ')+S.cf+_t(' ชั้น',' floors')+' · '+_t('แจ้งเตือนรวม ','alerts ')+S.bad,'#EF4444',br(x=>x.crit||0,()=>'#EF4444'))+
   k(_t('พื้นที่มีกิจกรรม (เตือน)','Areas with activity'),S.warn,_t('ชั้นที่มีเรื่อง ','floors affected ')+S.af+'/'+S.fl,'#A855F7',br(x=>x.warn||0,x=>wpActCol(x.cnt)))+
   k('Open WR',S.wr,S.br?`<span style="color:#EF4444;font-weight:800">⚠ ${S.br} ${_t('เกิน SLA','SLA breach')}</span>`:_t('ไม่มีงานเกิน SLA','no SLA breach'),'#3B82F6',br(x=>x.wr||0,()=>'#3B82F6'))};

{const _sl=bcsSelect;bcsSelect=function(){const r=_sl.apply(this,arguments);try{bcsKpis()}catch(e){}return r}}

function wpFlTag(fid){const l=String(wpFlLabel(fid));return l==='S'||/^R(oof)?$/i.test(l)?'F-Roof':'F'+l}

// boot
applyTheme();authBoot();load();buildChrome();renderUser();if(!me())showLogin();
else setTimeout(()=>syncBoot(()=>{buildChrome();render()}),50);
(function(){const h=(location.hash||'').slice(1);CUR=viewOk(h)?h:'front';render()})();
</script>
